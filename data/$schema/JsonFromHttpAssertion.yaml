$schema: https://json-schema.org/draft/2020-12/schema
$id: JsonFromHttpAssertion.yaml
type: object
properties:
  type:
    type: string
    const: JSON_FROM_HTTP
  url:
    type: string
  method:
    anyOf:
      - type: string
        const: GET
      - type: string
        const: POST
      - type: string
        const: PUT
      - type: string
        const: DELETE
  path:
    type: string
  operation:
    anyOf:
      - type: string
        const: ne
      - type: string
        const: eq
  value: {}
required:
  - type
  - url
  - method
  - path
  - operation
  - value
allOf:
  - $ref: Assertion.yaml
