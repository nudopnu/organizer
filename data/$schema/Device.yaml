$schema: https://json-schema.org/draft/2020-12/schema
$id: Device.yaml
type: object
properties:
  name:
    type: string
  description:
    type: string
  flags:
    type: array
    items:
      type: string
  image:
    type: string
  attributes:
    $ref: "#/$defs/RecordUnknown"
required:
  - name
  - description
  - flags
  - image
  - attributes
additionalProperties: false
$defs:
  RecordUnknown:
    type: object
    properties: {}
    unevaluatedProperties: {}
